<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ApniSaree.com — Saree hi Saree, har Indian aurat ki pehli nishaani. Elegant Indian sarees from Delhi.">
  <meta name="theme-color" content="#641d2c">

  <title>ApniSaree.com | Saree hi Saree</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ivory: #fbf7f0;
      --cream: #f4eadc;
      --beige: #e8d8c5;
      --maroon: #641d2c;
      --maroon-dark: #47121e;
      --maroon-soft: #7d3344;
      --gold: #ad8a52;
      --gold-light: #d4bc8c;
      --charcoal: #292424;
      --muted: #766d69;
      --white: #ffffff;
      --border: rgba(100, 29, 44, 0.13);
      --shadow: 0 16px 45px rgba(55, 29, 29, 0.08);
      --radius: 18px;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 82px;
    }

    body {
      font-family: var(--sans);
      background: var(--ivory);
      color: var(--charcoal);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin-inline: auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--gold);
    }

    .section-heading {
      max-width: 650px;
      margin-bottom: 34px;
    }

    .section-heading h2 {
      margin-top: 8px;
      color: var(--maroon);
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
      font-weight: 600;
    }

    .section-heading p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(251, 247, 240, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      line-height: 1;
      flex-shrink: 0;
    }

    .brand-name {
      color: var(--maroon);
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: var(--gold);
      font-size: 0.54rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .desktop-nav {
      display: none;
      align-items: center;
      gap: 28px;
    }

    .desktop-nav a {
      position: relative;
      color: var(--charcoal);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .desktop-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 1px;
      background: var(--maroon);
      transition: width 0.25s ease;
    }

    .desktop-nav a:hover::after {
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
      position: relative;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--maroon);
      transition: 0.25s ease;
    }

    .icon-btn:hover {
      background: var(--cream);
      border-color: var(--gold-light);
    }

    .cart-count {
      position: absolute;
      top: -2px;
      right: -1px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 50px;
      background: var(--maroon);
      color: var(--white);
      font-size: 0.64rem;
      font-weight: 700;
      border: 2px solid var(--ivory);
    }

    .whatsapp-header {
      display: none;
      align-items: center;
      gap: 7px;
      padding: 10px 15px;
      border-radius: 50px;
      background: var(--maroon);
      color: var(--white);
      font-size: 0.78rem;
      font-weight: 700;
      transition: 0.25s ease;
    }

    .whatsapp-header:hover {
      background: var(--maroon-dark);
      transform: translateY(-1px);
    }

    .hamburger {
      display: inline-grid;
    }

    /* Mobile menu */
    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 1100;
      visibility: hidden;
      pointer-events: none;
    }

    .mobile-menu.active {
      visibility: visible;
      pointer-events: auto;
    }

    .mobile-menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(41, 36, 36, 0.42);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .mobile-menu-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: min(330px, 88vw);
      height: 100%;
      padding: 28px;
      background: var(--ivory);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .mobile-menu.active .mobile-menu-backdrop {
      opacity: 1;
    }

    .mobile-menu.active .mobile-menu-panel {
      transform: translateX(0);
    }

    .menu-close {
      margin-left: auto;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--maroon);
      font-size: 1.35rem;
    }

    .mobile-nav {
      display: flex;
      flex-direction: column;
      margin-top: 45px;
    }

    .mobile-nav a {
      padding: 17px 0;
      border-bottom: 1px solid var(--border);
      color: var(--maroon);
      font-family: var(--serif);
      font-size: 1.25rem;
    }

    /* Hero */
    .hero {
      position: relative;
      min-height: calc(100vh - 72px);
      min-height: calc(100svh - 72px);
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 20%, rgba(173, 138, 82, 0.13), transparent 27%),
        radial-gradient(circle at 10% 85%, rgba(100, 29, 44, 0.07), transparent 30%),
        var(--ivory);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      right: -160px;
      top: 80px;
      border: 1px solid rgba(173, 138, 82, 0.24);
      border-radius: 50%;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      right: -105px;
      top: 135px;
      border: 1px solid rgba(100, 29, 44, 0.13);
      border-radius: 50%;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 72px 0;
    }

    .hero-copy {
      max-width: 740px;
    }

    .hero h1 {
      margin-top: 17px;
      color: var(--maroon);
      font-family: var(--serif);
      font-size: clamp(3rem, 13vw, 6.8rem);
      line-height: 0.99;
      letter-spacing: -0.045em;
      font-weight: 600;
    }

    .hero h1 span {
      display: block;
      color: var(--charcoal);
      font-style: italic;
      font-weight: 500;
    }

    .hero-tagline {
      max-width: 530px;
      margin-top: 23px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: clamp(1rem, 3vw, 1.3rem);
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 21px;
      border: 1px solid transparent;
      border-radius: 50px;
      font-size: 0.84rem;
      font-weight: 700;
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--maroon);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--maroon-dark);
    }

    .btn-outline {
      border-color: var(--maroon);
      color: var(--maroon);
      background: transparent;
    }

    .btn-outline:hover {
      background: var(--cream);
    }

    .hero-ornament {
      position: absolute;
      right: 6%;
      bottom: 11%;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(173, 138, 82, 0.42);
      transform: rotate(45deg);
      opacity: 0.7;
    }

    .hero-ornament::before,
    .hero-ornament::after {
      content: "";
      position: absolute;
      inset: 19px;
      border: 1px solid rgba(100, 29, 44, 0.18);
    }

    .hero-ornament::after {
      inset: 38px;
      transform: rotate(45deg);
    }

    /* Collections */
    .collection {
      padding: 76px 0 90px;
      background: var(--white);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 3px 2px 12px;
      margin-bottom: 25px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 9px 17px;
      border: 1px solid var(--border);
      border-radius: 50px;
      background: var(--ivory);
      color: var(--charcoal);
      font-size: 0.78rem;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--maroon);
      background: var(--maroon);
      color: var(--white);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .product-card {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--ivory);
      border: 1px solid rgba(100, 29, 44, 0.09);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .product-image-wrap {
      position: relative;
      aspect-ratio: 0.78;
      overflow: hidden;
      background: var(--cream);
      cursor: pointer;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.55s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.035);
    }

    .image-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      text-align: center;
      background: var(--cream);
      color: var(--maroon);
      font-family: var(--serif);
      font-size: 1rem;
    }

    .image-fallback.show {
      display: grid;
    }

    .product-info {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 15px 13px 14px;
    }

    .product-category {
      color: var(--gold);
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .product-name {
      margin-top: 5px;
      color: var(--maroon);
      font-family: var(--serif);
      font-size: clamp(0.95rem, 3vw, 1.16rem);
      line-height: 1.22;
    }

    .product-description {
      display: -webkit-box;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.71rem;
      line-height: 1.45;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .product-bottom {
      margin-top: auto;
      padding-top: 13px;
    }

    .product-price {
      color: var(--charcoal);
      font-size: 0.96rem;
      font-weight: 700;
    }

    .product-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 11px;
    }

    .small-btn {
      min-height: 40px;
      width: 100%;
      padding: 8px 9px;
      border-radius: 50px;
      font-size: 0.69rem;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .details-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--maroon);
    }

    .details-btn:hover {
      border-color: var(--gold);
      background: var(--white);
    }

    .add-btn {
      border: 1px solid var(--maroon);
      background: var(--maroon);
      color: var(--white);
    }

    .add-btn:hover {
      background: var(--maroon-dark);
    }

    .no-products {
      grid-column: 1 / -1;
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
    }

    /* About */
    .about {
      padding: 82px 0;
      background: var(--cream);
    }

    .about-grid {
      display: grid;
      gap: 30px;
    }

    .about-copy h2 {
      margin-top: 9px;
      color: var(--maroon);
      font-family: var(--serif);
      font-size: clamp(2.1rem, 7vw, 3.5rem);
      line-height: 1.1;
    }

    .about-copy p {
      max-width: 650px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 1rem;
    }

    .about-location {
      margin-top: 25px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--maroon);
      font-weight: 700;
    }

    .about-mark {
      min-height: 230px;
      display: grid;
      place-items: center;
      position: relative;
      border: 1px solid rgba(100, 29, 44, 0.13);
      background: rgba(255,255,255,0.28);
      overflow: hidden;
    }

    .about-mark::before,
    .about-mark::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(173, 138, 82, 0.35);
      border-radius: 50%;
    }

    .about-mark::before {
      width: 230px;
      height: 230px;
    }

    .about-mark::after {
      width: 165px;
      height: 165px;
    }

    .about-mark span {
      position: relative;
      z-index: 1;
      color: var(--maroon);
      font-family: var(--serif);
      font-size: 2rem;
      font-style: italic;
    }

    /* Contact */
    .contact {
      padding: 78px 0;
      background: var(--white);
    }

    .contact-grid {
      display: grid;
      gap: 30px;
    }

    .contact-card {
      padding: 27px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--ivory);
    }

    .contact-card h3 {
      color: var(--maroon);
      font-family: var(--serif);
      font-size: 1.65rem;
    }

    .contact-list {
      display: grid;
      gap: 17px;
      margin-top: 23px;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .contact-icon {
      width: 37px;
      height: 37px;
      flex: 0 0 37px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--cream);
      color: var(--maroon);
    }

    .contact-item small {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }

    .contact-item a,
    .contact-item span {
      color: var(--charcoal);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .contact-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    /* Footer */
    footer {
      padding: 48px 0 28px;
      background: var(--maroon-dark);
      color: rgba(255,255,255,0.82);
    }

    .footer-grid {
      display: grid;
      gap: 30px;
    }

    .footer-brand .brand-name {
      color: var(--white);
      font-size: 1.55rem;
    }

    .footer-brand .brand-subtitle {
      color: var(--gold-light);
    }

    .footer-tagline {
      max-width: 360px;
      margin-top: 12px;
      color: rgba(255,255,255,0.66);
      font-family: var(--serif);
      font-size: 0.92rem;
    }

    .footer-contact {
      display: grid;
      gap: 8px;
      font-size: 0.82rem;
    }

    .footer-contact a:hover {
      color: var(--gold-light);
    }

    .footer-bottom {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.5);
      font-size: 0.72rem;
    }

    /* Floating buttons */
    .floating-actions {
      position: fixed;
      z-index: 900;
      right: 15px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 9px;
    }

    .floating-whatsapp,
    .floating-cart {
      min-height: 47px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 9px 28px rgba(41, 36, 36, 0.16);
      font-size: 0.73rem;
      font-weight: 700;
    }

    .floating-whatsapp {
      background: #2f7d4c;
      color: var(--white);
    }

    .floating-cart {
      display: none;
      background: var(--maroon);
      color: var(--white);
    }

    /* Modal base */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      background: rgba(29, 22, 23, 0.58);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal {
      width: 100%;
      max-height: 94vh;
      overflow-y: auto;
      background: var(--ivory);
      border-radius: 24px 24px 0 0;
      transform: translateY(25px);
      transition: transform 0.28s ease;
    }

    .overlay.active .modal {
      transform: translateY(0);
    }

    .modal-inner {
      position: relative;
      padding: 22px;
    }

    .modal-close {
      position: absolute;
      z-index: 2;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(251,247,240,0.94);
      color: var(--maroon);
      font-size: 1.3rem;
    }

    /* Product modal */
    .product-modal-grid {
      display: grid;
      gap: 23px;
    }

    .modal-product-image {
      width: 100%;
      aspect-ratio: 0.8;
      object-fit: cover;
      border-radius: 15px;
      background: var(--cream);
    }

    .modal-product-info {
      padding: 8px 2px 5px;
    }

    .modal-product-info .product-category {
      font-size: 0.7rem;
    }

    .modal-product-info h2 {
      margin-top: 8px;
      color: var(--maroon);
      font-family: var(--serif);
      font-size: clamp(1.9rem, 7vw, 3rem);
      line-height: 1.1;
    }

    .modal-price {
      marg
